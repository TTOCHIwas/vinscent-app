name: Android release candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha_confirmation:
        description: Full main commit SHA to build
        required: true
        type: string
      build_number:
        description: Unique positive Android version code
        required: true
        type: string
      publish_internal:
        description: Upload the verified bundle to Google Play internal testing
        required: true
        default: false
        type: boolean
      release_notes_ko:
        description: Korean internal-test release notes (up to 500 characters)
        required: false
        default: 내부 테스트 안정성을 개선했어요
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true
  BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  build:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require an exact main commit
        env:
          CONFIRMED_COMMIT_SHA: ${{ inputs.commit_sha_confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Android release candidates must be built from main." >&2
            exit 1
          fi
          if [[ ! "$CONFIRMED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha_confirmation must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "$CONFIRMED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Confirmed commit does not match the workflow commit." >&2
            exit 1
          fi
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Validate release configuration
        env:
          DANJJAN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.DANJJAN_UPLOAD_KEYSTORE_BASE64 }}
          DANJJAN_UPLOAD_STORE_PASSWORD: ${{ secrets.DANJJAN_UPLOAD_STORE_PASSWORD }}
          DANJJAN_UPLOAD_KEY_ALIAS: ${{ secrets.DANJJAN_UPLOAD_KEY_ALIAS }}
          DANJJAN_UPLOAD_KEY_PASSWORD: ${{ secrets.DANJJAN_UPLOAD_KEY_PASSWORD }}
          DANJJAN_SUPABASE_URL: ${{ secrets.DANJJAN_SUPABASE_URL }}
          DANJJAN_SUPABASE_ANON_KEY: ${{ secrets.DANJJAN_SUPABASE_ANON_KEY }}
          DANJJAN_KAKAO_NATIVE_APP_KEY: ${{ secrets.DANJJAN_KAKAO_NATIVE_APP_KEY }}
          DANJJAN_POLICY_BASE_URL: ${{ vars.DANJJAN_POLICY_BASE_URL }}
          DANJJAN_PLAY_UPLOAD_CERT_SHA256: ${{ vars.DANJJAN_PLAY_UPLOAD_CERT_SHA256 }}
          DANJJAN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.DANJJAN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLISH_INTERNAL: ${{ inputs.publish_internal }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer." >&2
            exit 1
          fi

          required=(
            DANJJAN_UPLOAD_KEYSTORE_BASE64
            DANJJAN_UPLOAD_STORE_PASSWORD
            DANJJAN_UPLOAD_KEY_ALIAS
            DANJJAN_UPLOAD_KEY_PASSWORD
            DANJJAN_SUPABASE_URL
            DANJJAN_SUPABASE_ANON_KEY
            DANJJAN_KAKAO_NATIVE_APP_KEY
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing android-release secret: $variable" >&2
              exit 1
            fi
          done

          if [[ "$PUBLISH_INTERNAL" == "true" && -z "$DANJJAN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Missing android-release secret: DANJJAN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi

          validate_https_url() {
            local variable_name="$1"
            local value="$2"
            local authority="${value#https://}"
            authority="${authority%%/*}"

            if [[ "$value" != https://* ||
                  -z "$authority" ||
                  "$value" == *[[:space:]]* ||
                  "$value" == *"?"* ||
                  "$value" == *"#"* ||
                  "$value" == *"@"* ]]; then
              echo "${variable_name} must be an HTTPS URL with a host and without whitespace, user info, query, or fragment." >&2
              exit 1
            fi
          }

          validate_https_url "DANJJAN_SUPABASE_URL" "$DANJJAN_SUPABASE_URL"
          validate_https_url "DANJJAN_POLICY_BASE_URL" "$DANJJAN_POLICY_BASE_URL"
          play_upload_fingerprint="${DANJJAN_PLAY_UPLOAD_CERT_SHA256^^}"
          play_upload_fingerprint="${play_upload_fingerprint//:/}"
          if [[ ! "$play_upload_fingerprint" =~ ^[A-F0-9]{64}$ ]]; then
            echo "DANJJAN_PLAY_UPLOAD_CERT_SHA256 must be a SHA-256 certificate fingerprint." >&2
            exit 1
          fi
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Resolve release metadata
        id: release-metadata
        run: |
          set -euo pipefail
          app_version="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "pubspec version must be a semantic Android version name." >&2
            exit 1
          fi
          printf 'app_version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"
      - name: Verify resolved release source
        run: ../../scripts/verify_release_source.sh "$GITHUB_SHA"
      - name: Restore Android upload key
        env:
          DANJJAN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.DANJJAN_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$DANJJAN_UPLOAD_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/danjjan-upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/danjjan-upload-keystore.jks"
          test -s "$RUNNER_TEMP/danjjan-upload-keystore.jks"
      - name: Build signed Android App Bundle
        env:
          DANJJAN_UPLOAD_STORE_FILE: ${{ runner.temp }}/danjjan-upload-keystore.jks
          DANJJAN_UPLOAD_STORE_PASSWORD: ${{ secrets.DANJJAN_UPLOAD_STORE_PASSWORD }}
          DANJJAN_UPLOAD_KEY_ALIAS: ${{ secrets.DANJJAN_UPLOAD_KEY_ALIAS }}
          DANJJAN_UPLOAD_KEY_PASSWORD: ${{ secrets.DANJJAN_UPLOAD_KEY_PASSWORD }}
          DANJJAN_SUPABASE_URL: ${{ secrets.DANJJAN_SUPABASE_URL }}
          DANJJAN_SUPABASE_ANON_KEY: ${{ secrets.DANJJAN_SUPABASE_ANON_KEY }}
          DANJJAN_KAKAO_NATIVE_APP_KEY: ${{ secrets.DANJJAN_KAKAO_NATIVE_APP_KEY }}
          DANJJAN_POLICY_BASE_URL: ${{ vars.DANJJAN_POLICY_BASE_URL }}
        run: |
          flutter build appbundle \
            --release \
            --build-number "$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$DANJJAN_SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$DANJJAN_SUPABASE_ANON_KEY" \
            --dart-define=KAKAO_NATIVE_APP_KEY="$DANJJAN_KAKAO_NATIVE_APP_KEY" \
            --dart-define=POLICY_BASE_URL="$DANJJAN_POLICY_BASE_URL"
      - name: Prepare release evidence
        env:
          DANJJAN_UPLOAD_STORE_PASSWORD: ${{ secrets.DANJJAN_UPLOAD_STORE_PASSWORD }}
          DANJJAN_UPLOAD_KEY_ALIAS: ${{ secrets.DANJJAN_UPLOAD_KEY_ALIAS }}
          DANJJAN_PLAY_UPLOAD_CERT_SHA256: ${{ vars.DANJJAN_PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          source_aab="build/app/outputs/bundle/release/app-release.aab"
          source_mapping="build/app/outputs/mapping/release/mapping.txt"
          source_manifest="build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          upload_keystore="$RUNNER_TEMP/danjjan-upload-keystore.jks"
          release_dir="build/release-evidence"
          release_name="danjjan-android-build-${BUILD_NUMBER}"
          app_version="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          signature_log="$RUNNER_TEMP/danjjan-aab-signature.log"
          signature_report="$RUNNER_TEMP/danjjan-aab-signature.txt"
          bundle_certificates="$RUNNER_TEMP/danjjan-aab-certificates.txt"
          bundle_certificate="$RUNNER_TEMP/danjjan-aab-certificate.pem"
          expected_certificate="$RUNNER_TEMP/danjjan-upload-certificate.pem"

          test -s "$source_aab"
          test -s "$source_mapping"
          test -s "$source_manifest"
          test -s "$upload_keystore"
          command -v jarsigner >/dev/null
          command -v keytool >/dev/null
          command -v openssl >/dev/null
          unzip -t "$source_aab" >/dev/null
          unzip -l "$source_aab" > "$RUNNER_TEMP/danjjan-aab-contents.txt"
          grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols/" \
            "$RUNNER_TEMP/danjjan-aab-contents.txt"
          grep -q "BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map" \
            "$RUNNER_TEMP/danjjan-aab-contents.txt"
          if ! jarsigner -verify -verbose:summary "$source_aab" \
            > "$signature_log" 2>&1; then
            cat "$signature_log"
            exit 1
          fi
          if ! grep -Fq "jar verified." "$signature_log"; then
            cat "$signature_log"
            echo "Release AAB is not signed with a verifiable JAR signature." >&2
            exit 1
          fi
          keytool \
            '-J-Duser.language=en' \
            '-J-Duser.country=US' \
            -printcert \
            -jarfile "$source_aab" \
            -rfc > "$bundle_certificates"
          signer_count="$(
            grep -Ec '^Signer #[0-9]+:' "$bundle_certificates" || true
          )"
          if [[ "$signer_count" != "1" ]]; then
            echo "Release AAB must have exactly one signer; found $signer_count." >&2
            exit 1
          fi
          awk '
            /-----BEGIN CERTIFICATE-----/ { capture = 1 }
            capture { print }
            /-----END CERTIFICATE-----/ { exit }
          ' "$bundle_certificates" > "$bundle_certificate"
          keytool \
            -exportcert \
            -rfc \
            -keystore "$upload_keystore" \
            -alias "$DANJJAN_UPLOAD_KEY_ALIAS" \
            -storepass:env DANJJAN_UPLOAD_STORE_PASSWORD \
            > "$expected_certificate"
          test -s "$bundle_certificate"
          test -s "$expected_certificate"

          bundle_fingerprint="$(
            openssl x509 \
              -in "$bundle_certificate" \
              -noout \
              -fingerprint \
              -sha256 |
              cut -d= -f2 |
              tr -d ':'
          )"
          expected_fingerprint="$(
            openssl x509 \
              -in "$expected_certificate" \
              -noout \
              -fingerprint \
              -sha256 |
              cut -d= -f2 |
              tr -d ':'
          )"
          if [[ -z "$bundle_fingerprint" ||
                "$bundle_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Release AAB signer does not match the configured upload key." >&2
            exit 1
          fi
          play_upload_fingerprint="${DANJJAN_PLAY_UPLOAD_CERT_SHA256^^}"
          play_upload_fingerprint="${play_upload_fingerprint//:/}"
          if [[ "$bundle_fingerprint" != "$play_upload_fingerprint" ]]; then
            echo "Release AAB signer does not match the Play upload certificate." >&2
            exit 1
          fi

          now_epoch="$(date -u +%s)"
          certificate_start="$(
            openssl x509 -in "$bundle_certificate" -noout -startdate |
              cut -d= -f2-
          )"
          certificate_start_epoch="$(date -u -d "$certificate_start" +%s)"
          if (( certificate_start_epoch > now_epoch )); then
            echo "Release upload certificate is not valid yet." >&2
            exit 1
          fi
          play_minimum_expiry_epoch="$(
            date -u -d '2033-10-23T00:00:00Z' +%s
          )"
          minimum_remaining_seconds="$((play_minimum_expiry_epoch - now_epoch))"
          if (( minimum_remaining_seconds < 0 )); then
            minimum_remaining_seconds=0
          fi
          if ! openssl x509 \
            -in "$bundle_certificate" \
            -noout \
            -checkend "$minimum_remaining_seconds"; then
            echo "Release upload certificate must expire after 2033-10-22." >&2
            exit 1
          fi
          {
            printf 'upload_signature=verified\n'
            printf 'upload_certificate_match=verified\n'
            printf 'upload_certificate_validity=verified\n'
            printf 'play_upload_certificate_match=verified\n'
            printf 'minimum_certificate_expiry=after_2033-10-22\n'
          } > "$signature_report"

          manifest_package="$(
            sed -n \
              's/.*package="\([^"]*\)".*/\1/p' \
              "$source_manifest" |
              head -n 1
          )"
          version_code="$(
            sed -n \
              's/.*android:versionCode="\([0-9][0-9]*\)".*/\1/p' \
              "$source_manifest" |
              head -n 1
          )"
          version_name="$(
            sed -n \
              's/.*android:versionName="\([^"]*\)".*/\1/p' \
              "$source_manifest" |
              head -n 1
          )"
          min_sdk="$(
            sed -n \
              's/.*android:minSdkVersion="\([0-9][0-9]*\)".*/\1/p' \
              "$source_manifest" |
              head -n 1
          )"
          target_sdk="$(
            sed -n \
              's/.*android:targetSdkVersion="\([0-9][0-9]*\)".*/\1/p' \
              "$source_manifest" |
              head -n 1
          )"

          if [[ "$manifest_package" != "com.vinscent.vinscent" ]]; then
            echo "Release package must be com.vinscent.vinscent; found '${manifest_package:-missing}'." >&2
            exit 1
          fi
          if [[ "$version_code" != "$BUILD_NUMBER" ]]; then
            echo "Release versionCode must be $BUILD_NUMBER; found '${version_code:-missing}'." >&2
            exit 1
          fi
          if [[ "$version_name" != "$app_version" ]]; then
            echo "Release versionName must be $app_version; found '${version_name:-missing}'." >&2
            exit 1
          fi
          if [[ "$min_sdk" != "24" ]]; then
            echo "Release minimum SDK must remain 24; found '${min_sdk:-missing}'." >&2
            exit 1
          fi
          if [[ ! "$target_sdk" =~ ^[0-9]+$ ]] || (( target_sdk < 36 )); then
            echo "Release target SDK must be at least 36; found '${target_sdk:-missing}'." >&2
            exit 1
          fi

          dart run tool/verify_android_manifest_permissions.dart \
            "$source_manifest"

          mkdir -p "$release_dir"
          dart run tool/verify_android_release_bundle.dart \
            "$source_aab" \
            "$release_dir/${release_name}-16kb-page-support.json"
          cp "$source_aab" "$release_dir/${release_name}.aab"
          cp "$source_mapping" "$release_dir/${release_name}-mapping.txt"
          cp "$source_manifest" "$release_dir/${release_name}-AndroidManifest.xml"
          cp "$RUNNER_TEMP/danjjan-aab-contents.txt" \
            "$release_dir/${release_name}-aab-contents.txt"
          cp "$signature_report" \
            "$release_dir/${release_name}-aab-signature.txt"
          (
            cd "$release_dir"
            sha256sum "${release_name}.aab" > "${release_name}.aab.sha256"
            sha256sum "${release_name}-mapping.txt" \
              > "${release_name}-mapping.txt.sha256"
            sha256sum "${release_name}-AndroidManifest.xml" \
              > "${release_name}-AndroidManifest.xml.sha256"
            sha256sum "${release_name}-16kb-page-support.json" \
              > "${release_name}-16kb-page-support.json.sha256"
            sha256sum "${release_name}-aab-contents.txt" \
              > "${release_name}-aab-contents.txt.sha256"
            sha256sum "${release_name}-aab-signature.txt" \
              > "${release_name}-aab-signature.txt.sha256"
          )

          {
            printf 'commit_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'package_name=%s\n' "$manifest_package"
            printf 'app_version=%s\n' "$app_version"
            printf 'build_number=%s\n' "$BUILD_NUMBER"
            printf 'min_sdk=%s\n' "$min_sdk"
            printf 'target_sdk=%s\n' "$target_sdk"
            printf 'page_alignment=16KB\n'
            printf 'upload_signature=verified\n'
            printf 'upload_certificate_match=verified\n'
            printf 'upload_certificate_validity=verified\n'
            printf 'play_upload_certificate_match=verified\n'
            printf 'native_debug_symbols=embedded\n'
            printf 'proguard_mapping=embedded_and_exported\n'
            printf 'built_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$release_dir/metadata.txt"
      - name: Verify final release source
        run: ../../scripts/verify_release_source.sh "$GITHUB_SHA"
      - name: Upload release evidence
        id: release-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: danjjan-android-build-${{ inputs.build_number }}
          path: apps/mobile/build/release-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Prepare Google Play internal release
        if: ${{ inputs.publish_internal }}
        env:
          DANJJAN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.DANJJAN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES_KO: ${{ inputs.release_notes_ko }}
        run: |
          set -euo pipefail
          credential="$RUNNER_TEMP/danjjan-google-play-service-account.json"
          notes_dir="$RUNNER_TEMP/danjjan-whats-new"

          printf '%s' "$DANJJAN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$credential"
          chmod 600 "$credential"
          jq -e '
            .type == "service_account" and
            (.client_email | type == "string" and length > 0) and
            (.private_key | type == "string" and contains("BEGIN PRIVATE KEY"))
          ' "$credential" >/dev/null

          if [[ -z "${RELEASE_NOTES_KO//[[:space:]]/}" ]]; then
            echo "release_notes_ko must not be blank when publishing." >&2
            exit 1
          fi
          notes_length="$(jq -n --arg notes "$RELEASE_NOTES_KO" '$notes | length')"
          if (( notes_length > 500 )); then
            echo "release_notes_ko must be 500 characters or fewer." >&2
            exit 1
          fi

          mkdir -p "$notes_dir"
          printf '%s\n' "$RELEASE_NOTES_KO" > "$notes_dir/whatsnew-ko-KR"
      - name: Publish to Google Play internal testing
        if: ${{ inputs.publish_internal }}
        id: play-upload
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/danjjan-google-play-service-account.json
          packageName: com.vinscent.vinscent
          releaseFiles: apps/mobile/build/release-evidence/danjjan-android-build-${{ inputs.build_number }}.aab
          tracks: internal
          status: completed
          releaseName: 단짠 ${{ steps.release-metadata.outputs.app_version }} (${{ inputs.build_number }})
          whatsNewDirectory: ${{ runner.temp }}/danjjan-whats-new
          mappingFile: apps/mobile/build/release-evidence/danjjan-android-build-${{ inputs.build_number }}-mapping.txt
      - name: Summarize release candidate
        env:
          PUBLISH_INTERNAL: ${{ inputs.publish_internal }}
        run: |
          {
            echo "### Android release candidate"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`${{ steps.release-metadata.outputs.app_version }} ($BUILD_NUMBER)\`"
            echo "- Build number: \`$BUILD_NUMBER\`"
            echo "- Artifact digest: \`${{ steps.release-artifact.outputs.artifact-digest }}\`"
            if [[ "$PUBLISH_INTERNAL" == "true" ]]; then
              echo "- Google Play track: \`internal\`"
            else
              echo "- Google Play upload: skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove restored private inputs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/danjjan-upload-keystore.jks"
          rm -f "$RUNNER_TEMP/danjjan-google-play-service-account.json"
          rm -rf "$RUNNER_TEMP/danjjan-whats-new"
