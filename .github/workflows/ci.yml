name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  changes:
    name: Change detection
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci_config: ${{ steps.filter.outputs.ci_config }}
      mobile: ${{ steps.filter.outputs.mobile }}
      release_contracts: ${{ steps.filter.outputs.release_contracts }}
      ai: ${{ steps.filter.outputs.ai }}
      policy: ${{ steps.filter.outputs.policy }}
      edge: ${{ steps.filter.outputs.edge }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/ci-paths.yml
      - name: Reject tracked release secrets
        run: node scripts/verify_tracked_secrets.mjs

  mobile:
    name: Flutter
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze Flutter
        run: flutter analyze --no-pub
      - name: Test Flutter
        run: flutter test --no-pub
      - name: Test Android native code
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Build Android debug APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug --no-pub

  android-integration:
    name: Android integration
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test production Android startup
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          working-directory: apps/mobile
          script: flutter test integration_test/app_startup_test.dart --no-pub

  ios-build:
    name: iOS native build
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build iOS app and widget extension
        run: flutter build ios --simulator --debug --no-codesign --no-pub

  node-services:
    name: Node services
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.changes.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.release_contracts == 'true' || needs.changes.outputs.ai == 'true' || needs.changes.outputs.policy == 'true')
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: needs.changes.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.release_contracts == 'true' || needs.changes.outputs.ai == 'true' || needs.changes.outputs.policy == 'true')
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Test repository release contracts
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.release_contracts == 'true'
        run: node --test "tests/release/*.test.mjs"
      - name: Test AI service
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.ai == 'true'
        working-directory: services/ai-api
        run: npm test
      - name: Install policy web dependencies
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.policy == 'true'
        working-directory: apps/policy-web
        run: npm ci
      - name: Lint policy web
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.policy == 'true'
        working-directory: apps/policy-web
        run: npm run lint
      - name: Test policy web
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.policy == 'true'
        working-directory: apps/policy-web
        run: npm test

  edge-functions:
    name: Edge functions
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: "2.9.4"
          cache: true
      - name: Test Edge function units
        run: node scripts/test_supabase_functions.mjs
      - name: Type-check Edge entrypoints
        shell: bash
        run: |
          mapfile -t entrypoints < <(
            find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts -print |
              sort
          )
          test "${#entrypoints[@]}" -gt 0
          deno check "${entrypoints[@]}"

  database:
    name: Supabase database
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.109.1"
      - name: Start local database
        run: supabase db start
      - name: Test database contracts
        run: supabase test db
      - name: Lint database
        run: supabase db lint --local --level error
      - name: Stop local database
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
