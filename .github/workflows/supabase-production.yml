name: Supabase production release

on:
  workflow_dispatch:
    inputs:
      commit_sha_confirmation:
        description: Full main commit SHA to deploy
        required: true
        type: string
      project_ref_confirmation:
        description: Supabase production project ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

env:
  CI: true

jobs:
  deploy:
    name: Deploy migrations and Edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Require an exact main commit
        env:
          CONFIRMED_COMMIT_SHA: ${{ inputs.commit_sha_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Supabase production releases must run from main." >&2
            exit 1
          fi
          if [[ ! "$CONFIRMED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha_confirmation must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "$CONFIRMED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Confirmed commit does not match the workflow commit." >&2
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Verify deployment release source
        run: scripts/verify_release_source.sh "$GITHUB_SHA"
      - name: Verify runtime deployment configuration
        run: node scripts/verify_supabase_runtime_environment.mjs
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.109.1"
      - name: Validate protected production inputs
        env:
          CONFIRMED_PROJECT_REF: ${{ inputs.project_ref_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            SUPABASE_PROJECT_ID
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing supabase-production value: $variable" >&2
              exit 1
            fi
          done
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_ID must be a 20-character project ref." >&2
            exit 1
          fi
          if [[ "$CONFIRMED_PROJECT_REF" != "$SUPABASE_PROJECT_ID" ]]; then
            echo "Confirmed project ref does not match the protected environment." >&2
            exit 1
          fi
      - name: Link protected production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify production Edge secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --output json \
            > "$RUNNER_TEMP/secrets-before-deploy.json"
          node scripts/verify_supabase_secret_inventory.mjs \
            --remote "$RUNNER_TEMP/secrets-before-deploy.json"
      - name: Reject untracked remote Edge functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --output json \
            > "$RUNNER_TEMP/functions-before-deploy.json"
          node scripts/verify_supabase_function_inventory.mjs \
            --remote "$RUNNER_TEMP/functions-before-deploy.json" \
            --allow-missing
      - name: Reject untracked remote migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list \
            --linked \
            --output-format json \
            > "$RUNNER_TEMP/migrations-before-deploy.json"
          node scripts/verify_supabase_migration_inventory.mjs \
            --remote "$RUNNER_TEMP/migrations-before-deploy.json" \
            --allow-unapplied
      - name: Preview pending migrations
        run: supabase db push --linked --dry-run
      - name: Apply pending migrations
        run: supabase db push --linked --yes
      - name: Deploy all tracked Edge functions
        run: >-
          supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
      - name: Enforce client JWT verification
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/generate-ai-proactive-suggestion-jwt.json"
          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request PATCH \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/generate-ai-proactive-suggestion" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"verify_jwt":true}'
          )"
          if [[ "$http_status" != "200" ]]; then
            echo "Failed to enforce proactive suggestion JWT verification (HTTP $http_status)." >&2
            exit 1
          fi
      - name: Capture release evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="build/supabase-release-evidence"
          mkdir -p "$evidence_dir"
          supabase --version > "$evidence_dir/supabase-cli-version.txt"
          supabase migration list \
            --linked \
            --output-format json \
            > "$evidence_dir/migrations.json"
          node scripts/verify_supabase_migration_inventory.mjs \
            --remote "$evidence_dir/migrations.json"
          supabase functions list \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --output json \
            > "$evidence_dir/functions.json"
          node scripts/verify_supabase_function_inventory.mjs \
            --remote "$evidence_dir/functions.json"
          find supabase/migrations -type f -name '*.sql' -print0 |
            sort -z |
            xargs -0 sha256sum > "$evidence_dir/migration-files.sha256"
          find supabase/functions -type f -print0 |
            sort -z |
            xargs -0 sha256sum > "$evidence_dir/function-files.sha256"
          {
            printf 'commit_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'project_ref=%s\n' "$SUPABASE_PROJECT_ID"
            printf 'deployed_at_utc=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$evidence_dir/metadata.txt"
      - name: Verify final release source
        run: scripts/verify_release_source.sh "$GITHUB_SHA"
      - name: Upload release evidence
        id: release-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: danjjan-supabase-${{ github.sha }}
          path: build/supabase-release-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Summarize production release
        run: |
          {
            echo "### Supabase production release"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Project ref: \`$SUPABASE_PROJECT_ID\`"
            echo "- Artifact digest: \`${{ steps.release-artifact.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
